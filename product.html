<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Baitoey Phone - สินค้า</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: #fcf9f8;
    }

    .card {
      transition: 0.25s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(139, 83, 96, 0.12);
    }
  </style>
</head>

<body class="text-gray-800">

  <!-- เมนูด้านบน -->
  <header class="bg-white border-b sticky top-0 z-50">

    <div class="max-w-6xl mx-auto px-6 py-5 flex justify-between items-center">

      <a href="index.html"
         class="text-2xl font-bold text-[#8b5360]">
        Baitoey Phone
      </a>

      <nav class="flex gap-6 md:gap-8 font-medium">

        <a href="index.html"
           class="hover:text-[#8b5360]">
          หน้าแรก
        </a>

        <a href="product.html"
           class="text-[#8b5360] font-bold">
          สินค้า
        </a>

        <a href="contact-page.html"
           class="hover:text-[#8b5360]">
          ติดต่อ
        </a>

      </nav>

    </div>

  </header>


  <!-- เนื้อหาหน้าสินค้า -->
  <main class="max-w-6xl mx-auto px-6 py-12">

    <div class="text-center mb-10">

      <p class="text-[#8b5360] font-semibold tracking-widest">
        BAITOEY PHONE STORE
      </p>

      <h1 class="text-4xl font-bold mt-2">
        สินค้าของเรา
      </h1>

      <p class="text-gray-500 mt-3">
        เลือก iPhone รุ่นที่คุณชื่นชอบ
      </p>

    </div>


    <!-- รายการสินค้า -->
    <div class="grid md:grid-cols-3 gap-8">


      <!-- iPhone 18 -->
      <div class="card bg-white rounded-3xl p-5 shadow-sm">

        <img
          src="https://images.unsplash.com/photo-1592899677977-9c10ca588bbd?auto=format&fit=crop&w=800&q=80"
          alt="iPhone 18"
          class="w-full h-64 object-cover rounded-2xl">

        <h2 class="text-2xl font-bold mt-5">
          iPhone 18
        </h2>

        <p class="text-gray-500 mt-2">
          รุ่นใหม่ ดีไซน์สวยทันสมัย
        </p>

        <p class="text-[#8b5360] text-xl font-bold mt-4">
          ฿29,900
        </p>

        <button
          onclick="order('iPhone 18')"
          class="w-full mt-5 bg-[#8b5360] text-white py-3 rounded-xl hover:opacity-90">
          สั่งซื้อ
        </button>

      </div>


      <!-- iPhone 18 Pro -->
      <div class="card bg-white rounded-3xl p-5 shadow-sm">

        <img
          src="https://images.unsplash.com/photo-1592286927505-2fd7c7b4f7c2?auto=format&fit=crop&w=800&q=80"
          alt="iPhone 18 Pro"
          class="w-full h-64 object-cover rounded-2xl">

        <h2 class="text-2xl font-bold mt-5">
          iPhone 18 Pro
        </h2>

        <p class="text-gray-500 mt-2">
          ประสิทธิภาพระดับมืออาชีพ
        </p>

        <p class="text-[#8b5360] text-xl font-bold mt-4">
          ฿39,900
        </p>

        <button
          onclick="order('iPhone 18 Pro')"
          class="w-full mt-5 bg-[#8b5360] text-white py-3 rounded-xl hover:opacity-90">
          สั่งซื้อ
        </button>

      </div>


      <!-- iPhone 18 Pro Max -->
      <div class="card bg-white rounded-3xl p-5 shadow-sm">

        <img
          src="https://images.unsplash.com/photo-1592750475338-74b7b21085ab?auto=format&fit=crop&w=800&q=80"
          alt="iPhone 18 Pro Max"
          class="w-full h-64 object-cover rounded-2xl">

        <h2 class="text-2xl font-bold mt-5">
          iPhone 18 Pro Max
        </h2>

        <p class="text-gray-500 mt-2">
          หน้าจอใหญ่ พร้อมกล้องคุณภาพสูง
        </p>

        <p class="text-[#8b5360] text-xl font-bold mt-4">
          ฿44,900
        </p>

        <button
          onclick="order('iPhone 18 Pro Max')"
          class="w-full mt-5 bg-[#8b5360] text-white py-3 rounded-xl hover:opacity-90">
          สั่งซื้อ
        </button>

      </div>

    </div>

  </main>


  <!-- ส่วนท้าย -->
  <footer class="bg-white border-t text-center py-6 mt-10">

    <p class="text-gray-500">
      © 2026 Baitoey Phone
    </p>

  </footer>


  <script>
    function order(product) {
      alert(
        "คุณเลือก " + product +
        "\n\nกรุณาติดต่อ Baitoey Phone เพื่อดำเนินการสั่งซื้อค่ะ"
      );
    }
  </script>

</body>
</html>
